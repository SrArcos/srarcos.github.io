<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo transparente -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0.1"></stop>
    </radialGradient>
  </defs>

  <!-- Halo exterior -->
  <circle cx="256" cy="256" r="240" fill="url(#glow)" opacity="0.25"></circle>

  <!-- Borde exterior -->
  <circle cx="256" cy="256" r="220" stroke="#00f6ff" stroke-width="8" fill="none"></circle>

  <!-- Borde interior -->
  <circle cx="256" cy="256" r="200" stroke="#00d0e0" stroke-width="4" fill="none"></circle>

  <!-- Texto central -->
  <text x="50%" y="54%" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="120" font-weight="900" fill="#00f6ff" letter-spacing="6">
    XVP
  </text>

  <!-- Efecto brillo -->
  <circle cx="256" cy="256" r="220" stroke="#00f6ff" stroke-width="8" fill="none">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"></animate>
  </circle>
</svg>
